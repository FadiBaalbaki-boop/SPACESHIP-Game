<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship</title>
    <script defer src="./script.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body onload="init()">
    <header id="start">
        <h1>Spaceship</h1>
        <img src="./assets/img/raumschiff.png" alt="raumschiff">
        <button onclick="startGame()" id="playButton">Spiel beginnen</button>
    </header>
    <section class="game" id="game" hidden>
        <div class="gameover" id="gameOver"></div>
    <table id="spaceship_table" class="spaceship_status">

    </table>
    <div class="action-box">
    <div class="input_button">
    <input class="input" id="inputDamage" type="number">
    <button onclick="toTakeDamage()" class="button">Schaden hinzufügen</button>
    </div>
    <div class="input_button">
        <input class="input" id="inputBuyKits" type="number">
        <button onclick="buyRepairKits()" class="button">RepairKits kaufen</button>
    </div>
    <div class="input_button">
        <input class="input" id="inputUseKits" type="number">
        <button onclick="useRepairKits()" class="button">RepairKits benutzen</button>
    </div>
    </div>
    <div id="error" class="error">

    </div>
    </section>
    
</body>
</html>
